name: swasthai
description: SwasthAI — Your Family's Health, All in One Place.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.69.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # File / Image picker
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Maps / launch URLs
  url_launcher: ^6.3.0

  # Speech & TTS
  speech_to_text: ^6.6.2
  flutter_tts: ^4.1.0

  # Fonts
  google_fonts: ^6.2.1

  # HTTP (Gemini API)
  http: ^1.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  open_filex: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

